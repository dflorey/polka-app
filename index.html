<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Polka FS-3: a vintage-style music app from the FS family." />
    <meta name="theme-color" content="#24211d" />
    <title>Polka FS-3</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23ff2a14'/%3E%3C/svg%3E" />
    <!-- Installable app: manifest for Android/Chrome, meta tags and touch icon for iOS home screens -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Polka" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <script>
      // On its own (not embedded in another page) the page gets a solid backdrop; embedded, it
      // stays transparent so the host page shows around the device.
      if (window.self === window.top) document.documentElement.classList.add('solo');
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        /* Keep clear of notches, rounded corners and the home indicator. */
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        box-sizing: border-box;
        background: transparent;
      }
      /* Phones in portrait and short screens (phones held sideways): every pixel of height counts. */
      @media (max-width: 720px) and (orientation: portrait) {
        body {
          padding-top: max(12px, env(safe-area-inset-top));
          padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
      }
      @media (max-height: 520px) {
        body {
          padding-top: max(8px, env(safe-area-inset-top));
          padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
      }
      /*
       * Installed as an app there is no host page behind it, so give it a dark backdrop. The app
       * scales itself to fit the window, so the page never needs to scroll: no scrollbars at all.
       */
      @media (display-mode: standalone) {
        html {
          background: #24211d;
          overflow: hidden;
        }
        body {
          overscroll-behavior: none;
        }
      }
      /*
       * On its own page the device sits on a solid warm charcoal, a little lighter than the panel
       * so the case's drop shadow still reads, and matching the theme colour.
       */
      html.solo {
        min-height: 100%;
        background: #24211d;
      }
      polka-app:not(:defined) {
        display: none;
      }
    </style>

      place-items: center;
      width: 52px;
      height: var(--transport-key);
      padding: 0 0 4px;
      color: rgba(40, 37, 30, 0.82);
    }
    .transport-key:disabled .cap-icon {
      opacity: 0.35;
    }
    /* Caps coloured like a TR-808's: red Rec, a sage green Play, yellow Share */
    .transport-key.record {
      --cap-top: #ec5f45;
      --cap-mid: #d6412c;
      --cap-low: #ac2d1d;
      color: rgba(45, 12, 6, 0.8);
    }
    .transport-key.play {
      --cap-top: #b7cf96;
      --cap-mid: #98b577;
      --cap-low: #728f55;
      color: rgba(22, 34, 12, 0.8);
    }
    .transport-key.share {
      --cap-top: #f8dc78;
      --cap-mid: #ecc449;
      --cap-low: #c89f2d;
      color: rgba(52, 38, 6, 0.8);
    }
    /* Active (recording, playing): the icon lights up like an LED in the key's colour */
    .transport-key.record.active {
      --glow: #ff3b2f;
    }
    .transport-key.play.active {
      --glow: #4cdf6a;
    }
    .transport-key.active .cap-icon {
      color: color-mix(in srgb, var(--glow) 35%, white);
      filter: drop-shadow(0 0 2px var(--glow)) drop-shadow(0 0 5px var(--glow));
    }
    .cap-icon {
      position: relative;
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    /* The readout, level with the keys */
    .time {
      display: flex;
      align-items: center;
      height: var(--transport-key);
      margin-inline: 0.2rem;
    }
    .readout {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      box-sizing: border-box;
      min-width: 8.6rem;
      padding: 0.5rem 0.7rem 0.5rem 0.6rem;
      font: 700 0.72rem/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      color: #ffb347;
      text-shadow: 0 0 6px rgba(255, 150, 50, 0.65);
      border-radius: 3px;
      background: #0a0b0a;
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.95),
        0 0 0 2px #141412,
        0 0 0 3px #050505,
        0 1px 0 3px rgba(255, 255, 255, 0.08);
    }
    .readout-text {
      flex: 1;
      text-align: center;
    }
    /*
     * The record / play light: a rectangular segment at the left of the readout, as if part of
     * the same LED display; faintly visible when off, like unlit segments.
     */
    .status-led {
      flex: none;
      width: 5px;
      height: 12px;
      border-radius: 1px;
      background: color-mix(in srgb, var(--led) 16%, #0a0b0a);
    }
    .status-led.on {
      background: color-mix(in srgb, var(--led) 80%, white);
      box-shadow:
        0 0 4px var(--led),
        0 0 9px color-mix(in srgb, var(--led) 60%, transparent);
    }
    .status-led.on.blink {
      animation: segment-blink 1s steps(1) infinite;
    }
    @keyframes segment-blink {
      50% {
        background: color-mix(in srgb, var(--led) 16%, #0a0b0a);
        box-shadow: none;
      }
    }
    /* Narrow displays: narrower keys, and the readout shrinks to its text */
    @container (max-width: ${wr-1}px) {
      .transport {
        gap: 0.45rem;
      }
      .key.transport-key {
        width: 46px;
      }
      .time {
        margin-inline: 0;
      }
      .readout {
        gap: 0.4rem;
        min-width: 4.6rem;
        padding-inline: 0.45rem 0.5rem;
        font-size: 0.66rem;
        letter-spacing: 0.06em;
      }
    }
    /* Narrow phones: tighter still */
    @container (max-width: ${xr-1}px) {
      .transport {
        gap: 0.3rem;
      }
      .key.transport-key {
        width: 40px;
      }
      .transport .label {
        letter-spacing: 0.06em;
      }
      .readout {
        gap: 0.3rem;
        min-width: 0;
        padding-inline: 0.35rem 0.4rem;
      }
    }

    /* Plastic keycaps seated in dark panel cut-outs */
    button {
      font: inherit;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }
    .keys {
      /* The effect strip wraps by the panel's own width (see the container query below) */
      container-type: inline-size;
      display: grid;
      grid-template-columns: repeat(${z.length}, minmax(0, 1fr));
      gap: 0.6rem 1.2rem;
      padding: 1.4rem 2.4rem 1.5rem;
      border-top: 1px solid rgba(0, 0, 0, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.2));
    }
    /*
     * Effects strip above the keys: effect keys on the left, knobs on the right (name above each
     * knob, value below).
     */
    .effects {
      grid-column: 1 / -1;
      display: flex;
      /* Never wider than the panel: whatever doesn't fit moves to the next line */
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.9rem 1rem;
      margin-top: -0.4rem;
    }
    .fx-keys {
      display: flex;
      gap: 0.55rem;
    }
    .key.fx-key {
      width: 64px;
      height: 46px;
    }
    .knobs {
      display: flex;
      gap: 0.7rem;
    }
    .effect {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
    }
    /* Silkscreened line icon above each effect name, in panel ink */
    .icon {
      width: 18px;
      height: 18px;
      align-self: center;
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.85;
    }
    .effects value-knob {
      --knob-size: 56px;
    }
    .label.value {
      opacity: 0.55;
      font-weight: 400;
      letter-spacing: 0.08em;
    }
    .key {
      --cap-top: #f2ead4;
      --cap-mid: #e2d8bf;
      --cap-low: #c6bb9f;
      position: relative;
      height: 60px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background:
        var(--grain),
        linear-gradient(180deg, var(--cap-top) 0%, var(--cap-mid) 55%, var(--cap-low) 100%);
      background-size: 120px 120px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.75),
        inset 0 -5px 0 rgba(0, 0, 0, 0.16),
        inset 0 -6px 3px rgba(0, 0, 0, 0.08),
        0 0 0 2px #0e0e0d,
        0 0 0 3px rgba(255, 255, 255, 0.05),
        0 5px 7px 1px rgba(0, 0, 0, 0.55);
      transition:
        transform 0.05s,
        box-shadow 0.05s;
    }
    /* Slightly dished top face */
    .key::before {
      content: '';
      position: absolute;
      inset: 5px 5px 9px;
      border-radius: 3px;
      background: radial-gradient(ellipse at 50% 20%, rgba(255, 255, 255, 0.35), transparent 70%);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
      pointer-events: none;
    }
    .key:disabled {
      cursor: default;
    }
    .key:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.6),
        inset 0 -3px 0 rgba(0, 0, 0, 0.16),
        0 0 0 2px #0e0e0d,
        0 0 0 3px rgba(255, 255, 255, 0.05),
        0 2px 3px rgba(0, 0, 0, 0.6);
    }
    /* LED near the top of the cap, whatever the key's height */
    .key-led {
      position: absolute;
      top: 9px;
      left: 50%;
      width: 10px;
      height: 10px;
      margin-left: -5px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55) 0 1px, transparent 2.5px),
        radial-gradient(
          circle at 50% 50%,
          color-mix(in srgb, var(--led) 38%, black),
          color-mix(in srgb, var(--led) 18%, black)
        );
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.35),
        0 1px 0 1.5px rgba(255, 255, 255, 0.35);
      z-index: 1;
    }
    /* Lit in the colour of the key's act (--led, set per key) */
    .key-led.on {
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.85) 0 1px, transparent 2.5px),
        radial-gradient(
          circle at 50% 50%,
          color-mix(in srgb, var(--led) 45%, white),
          var(--led) 55%,
          color-mix(in srgb, var(--led) 75%, black)
        );
      box-shadow:
        0 0 0 1.5px rgba(0, 0, 0, 0.3),
        0 0 7px 3px color-mix(in srgb, var(--led) 60%, transparent);
    }
    /*
     * Act key with its name silkscreened below, lettered like the effect keys. Centred, so a name
     * wider than a narrow key spills out evenly on both sides.
     */
    .act {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      min-width: 0;
    }
    .act .key {
      align-self: stretch;
    }

    /* Share dialog: a small panel of the device's metal, the link in a recessed amber readout */
    .share-dialog {
      width: min(30rem, calc(100vw - 2rem));
      max-width: none;
      box-sizing: border-box;
      padding: 0;
      border: none;
      border-radius: 10px;
      color: var(--ink);
      background: transparent;
      overflow: visible;
    }
    .share-dialog::backdrop {
      background: rgba(12, 11, 9, 0.62);
    }
    .share-panel {
      position: relative;
      padding: 1.3rem 1.5rem 1.1rem;
      border-radius: 10px;
      background:
        var(--grain),
        radial-gradient(ellipse at 30% 0%, rgba(255, 255, 255, 0.07), transparent 60%),
        linear-gradient(180deg, #3a3935 0%, #2d2c29 60%, #242320 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.14),
        0 0 0 1px rgba(0, 0, 0, 0.7),
        0 18px 40px rgba(0, 0, 0, 0.6);
    }
    .share-panel .label {
      margin: 0;
      text-align: left;
    }
    .share-row {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-top: 0.9rem;
    }
    .share-link {
      flex: 1;
      min-width: 0;
      box-sizing: border-box;
      height: 40px;
      padding: 0 0.8rem;
      border: none;
      outline: none;
      font: 700 0.8rem/1 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      color: #ffb347;
      text-shadow: 0 0 6px rgba(255, 150, 50, 0.55);
      border-radius: 3px;
      background: #0a0b0a;
      box-shadow:
        inset 0 2px 6px rgba(0, 0, 0, 0.95),
        0 0 0 2px #141412,
        0 0 0 3px #050505,
        0 1px 0 3px rgba(255, 255, 255, 0.08);
      user-select: text;
      -webkit-user-select: text;
    }
    .share-link::selection {
      color: #1a1408;
      background: #ffb347;
      text-shadow: none;
    }
    .key.copy-key {
      display: grid;
      flex: none;
      place-items: center;
      width: 52px;
      height: 40px;
      padding: 0 0 4px;
      color: rgba(40, 37, 30, 0.82);
    }
    .share-note {
      margin: 0.8rem 0 0;
      font-size: 0.72rem;
      color: rgba(232, 225, 204, 0.55);
    }
    .share-close {
      position: absolute;
      top: 0.45rem;
      right: 0.6rem;
      width: 1.8rem;
      height: 1.8rem;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: none;
      font-size: 1.3rem;
      line-height: 1;
      color: rgba(232, 225, 204, 0.6);
      cursor: pointer;
    }
    .share-close:hover {
      color: var(--ink);
    }

    footer {
      padding: 0.7rem 2.4rem 0.8rem;
      font-size: 0.68rem;
      text-align: center;
      color: rgba(232, 225, 204, 0.45);
      border-top: 1px solid rgba(0, 0, 0, 0.6);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    /*
     * Tip button, centred in the name strip: a key like the others, but with a cap of brushed
     * aluminium, so it looks machined from the strip it sits in; the cup and lettering are etched
     * like the logo.
     */
    .tip-button {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 0.45rem;
      /* As tall as the FS-3 badge and the visit counter */
      height: calc(0.68 * 1.39 * var(--brand-size) + 0.22rem);
      padding: 0 0.85rem 0 0.7rem;
      box-sizing: border-box;
      white-space: nowrap;
      font-family: var(--label-font);
      font-size: 0.62rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      color: rgba(34, 32, 27, 0.85);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.65);
      border-radius: 5px;
      background:
        var(--brushed),
        linear-gradient(180deg, #f6f6f1 0%, #d6d6d0 48%, #c0c0ba 52%, #b2b2ac 100%);
      background-size: 300px 60px, auto;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -2px 0 rgba(0, 0, 0, 0.2),
        0 0 0 1.5px #2b2a26,
        0 0 0 2.5px rgba(255, 255, 255, 0.4),
        0 3px 4px rgba(0, 0, 0, 0.45);
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 0.05s,
        box-shadow 0.05s,
        filter 0.15s;
    }
    .tip-button:hover {
      filter: brightness(1.06);
    }
    .tip-button:active {
      transform: translate(-50%, calc(-50% + 1.5px));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2),
        0 0 0 1.5px #2b2a26,
        0 0 0 2.5px rgba(255, 255, 255, 0.4),
        0 1px 2px rgba(0, 0, 0, 0.5);
    }
    .tip-button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }
    .tip-icon {
      flex: none;
      width: 1.5em;
      height: 1.5em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0.8px 0 rgba(255, 255, 255, 0.65));
    }
    /* Narrow screens: no room in the strip, so the tip moves to the line under the device */
    @media (max-width: ${Vt-1}px) {
      .tip-button {
        display: none;
      }
    }
    @media (min-width: ${Vt}px) {
      .tip {
        display: none;
      }
    }
    /*
     * Tip line under the device. The page behind it may be light or dark, so it uses a mid-tone
     * that reads on both.
     */
    .tip {
      margin: 1.1rem 0 0;
      font-size: 0.78rem;
      line-height: 1.5;
      text-align: center;
      color: #8c8577;
    }
    /* Where the full sentence would wrap, fitTip() switches to just the link. */
    .tip-short,
    .tip.short .tip-long {
      display: none;
    }
    .tip.short .tip-short {
      display: inline;
    }
    .tip a {
      color: #e0533d;
      font-weight: 700;
      text-decoration: none;
      border-radius: 2px;
      -webkit-tap-highlight-color: transparent;
    }
    .tip a:hover {
      text-decoration: underline;
    }
    .tip a:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 3px;
    }
    kbd {
      font: inherit;
      font-weight: 700;
      padding: 0 0.3em;
      border: 1px solid rgba(232, 225, 204, 0.35);
      border-radius: 3px;
    }

    @media (max-width: 560px) {
      .display-section {
        padding: calc(1.7rem + 5px) calc(1.2rem + 5px) calc(1rem + 5px);
      }
      .keys {
        gap: 0.5rem;
        padding: 1.1rem 1rem 1.2rem;
      }
      .hints {
        visibility: hidden;
      }
    }
    /* Short screens (phones held sideways): tighter spacing, so the stage keeps most of the height. */
    @media (max-height: 520px) {
      :host {
        --min-display: 110px;
      }
      .tip {
        margin-top: 0.35rem;
      }
      header {
        padding-block: 0.5rem 0.45rem;
      }
      header {
        --brand-size: 1.2rem;
      }
      .display-section {
        padding-block: calc(1.45rem + 5px) calc(0.7rem + 5px);
      }
      .keys {
        padding-block: 0.7rem 0.8rem;
      }
      .key {
        height: 44px;
      }
      .key-led {
        top: 6px;
      }
      .transport {
        --transport-key: 34px;
      }
      .effects {
        margin-top: -0.2rem;
      }
      footer {
        display: none;
      }
    }
    /*
     * Panels too narrow for the effect keys and knobs on one line (they need about
     * EFFECTS_ONE_LINE_PX): they keep their size and wrap onto more lines, each line centred.
     */
    @container (max-width: ${mr-1}px) {
      .effects {
        justify-content: center;
      }
      .knobs {
        flex-wrap: wrap;
        justify-content: center;
      }
    }
    /*
     * Short screens (phones held sideways): smaller knobs and effect keys, as height is what runs
     * out first there, so the controls fit beside the display without scaling the device down.
     */
    @media (max-height: 520px) {
      .effects {
        gap: 0.6rem 1rem;
      }
      .effects value-knob {
        --knob-size: 40px;
      }
      .knobs {
        gap: 0.5rem;
      }
      .fx-keys {
        gap: 0.4rem;
      }
      .key.fx-key {
        width: 48px;
        height: 36px;
      }
      .effect .label,
      .act .label,
      .transport .label {
        font-size: 0.54rem;
        letter-spacing: 0.06em;
      }
      .icon {
        width: 14px;
        height: 14px;
      }
    }
    /*
     * Phones in portrait: the effect keys share a line of their own, and the knobs sit below in two
     * rows of three, rather than an uneven wrap.
     */
    @media (max-width: 640px) {
      .effects {
        flex-direction: column;
        align-items: stretch;
      }
      .fx-keys {
        display: grid;
        grid-template-columns: repeat(${et.length}, minmax(0, 1fr));
      }
      .fx-keys .effect {
        align-items: stretch;
        text-align: center;
      }
      .key.fx-key {
        width: auto;
      }
      /* Five effect keys share the line: tighter lettering so their names keep clear of each other */
      .fx-keys .label {
        letter-spacing: 0.06em;
      }
      .knobs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.9rem 0.3rem;
      }
    }
    /*
     * Phones held sideways (and other short landscape screens): the display on the left at full
     * height, the controls panel beside it on the right. Effect keys across the top, knobs below,
     * the act keys in two rows of three.
     */
    @media (orientation: landscape) and (max-height: 520px) {
      .panels {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .display-section {
        min-width: 0;
        padding-inline: calc(1.2rem + 5px) calc(1rem + 5px);
      }
      .keys {
        /* Wide enough for the six knobs and their names, never more than about half the device */
        flex: 0 0 clamp(320px, 48%, 400px);
        grid-template-columns: repeat(3, minmax(0, 1fr));
        /* The act keys' two rows grow a little into any height left over */
        grid-template-rows: auto repeat(2, minmax(54px, 64px));
        align-content: center;
        gap: 0.6rem;
        padding: 0.8rem 1.2rem 0.8rem 1rem;
        border-top: none;
        border-left: 1px solid rgba(0, 0, 0, 0.65);
        box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.06);
      }
      .effects {
        flex-direction: column;
        align-items: stretch;
        margin: 0 0 0.3rem;
      }
      .fx-keys {
        display: grid;
        grid-template-columns: repeat(${et.length}, minmax(0, 1fr));
      }
      .fx-keys .effect {
        align-items: stretch;
        text-align: center;
      }
      .key.fx-key {
        width: auto;
        height: 46px;
      }
      .effects value-knob {
        --knob-size: 46px;
      }
      .knobs {
        display: flex;
        flex-wrap: nowrap;
        justify-content: space-between;
        gap: 0.2rem;
        /* Breathing room between the knobs and the keys above and below them */
        margin-block: 0.5rem;
      }
      .act .key {
        flex: 1;
        height: auto;
        min-height: 36px;
      }
    }
    /* Narrow phones: slimmer walnut cheeks leave the keys more room. */
    @media (max-width: 400px) {
      .cheek {
        flex-basis: 20px;
